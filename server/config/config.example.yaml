# ZQUHelper 服务端配置样例。
# 复制为 config.yaml 后按需修改；config.yaml 不入库。

server:
  addr: "0.0.0.0:8787"

storage:
  # SQLite 数据库文件路径
  sqlite_path: "data/zquhelper.db"

jwgl:
  # 教务系统地址（校内直连）；校外走 WebVPN 时配置 webvpn_url
  base_url: "https://jwgl.zqu.edu.cn"
  webvpn_url: ""

auth:
  # Token 有效期（小时）
  token_ttl_hours: 720
